syntax = "proto3";

package bilibili.pgc.gateway.player.v2;

// Wire-compatible subset used to remove PGC prompts and casting restrictions.
message PromptBar {}

message ViewInfo {
    PromptBar try_watch_prompt_bar = 8;
}

message CastTips {
    int32 code = 1;
    string message = 2;
}

message PlayAbilityExtConf {
    CastTips cast_tips = 3;
}

message PlayViewReply {
    ViewInfo view_info = 5;
    PlayAbilityExtConf play_ext_conf = 6;
}
