syntax = "proto3";

package bilibili.main.community.reply.v1;

// Wire-compatible subset for comment ads, commercial links and tracking data.
message Url {
    string app_url_schema = 4;
    string click_report = 7;
    string exposure_report = 9;
    string pc_url = 13;
}

message Content {
    string message = 1;
    map<string, Url> url = 5;
}

message ReplyInfo {
    repeated ReplyInfo replies = 1;
    Content content = 12;
}

message CM {}

message SubjectTopCard {
    int32 type = 1;
}

message MainListReply {
    repeated ReplyInfo replies = 2;
    ReplyInfo up_top = 4;
    ReplyInfo admin_top = 5;
    ReplyInfo vote_top = 6;
    CM cm = 11;
    repeated ReplyInfo top_replies = 14;
    repeated SubjectTopCard subject_top_cards = 28;
}

message DetailListReply {
    ReplyInfo root = 3;
}

message ReplyInfoReply {
    ReplyInfo reply = 1;
}
