syntax = "proto3";

package bilibili.app.viewunite.v1;

// Wire-compatible subset of the unified playback-page response. Keeping this
// local avoids bundling the complete RPC schema into constrained script VMs.

message UniteOpaqueMessage {}

message CardBasicInfo {
    string unique_id = 6;
}

message RelateCard {
    int32 relate_card_type = 1;
    UniteOpaqueMessage cm_stock = 11;
    CardBasicInfo basic_info = 12;
}

message Relates {
    repeated RelateCard cards = 1;
}

message Module {
    int32 type = 1;
    oneof data {
        Relates relates = 22;
    }
}

message IntroductionTab {
    repeated Module modules = 2;
}

message TabModule {
    oneof tab {
        IntroductionTab introduction = 2;
    }
}

message Tab {
    repeated TabModule tab_module = 1;
}

message CM {}

message RelatesFeedReply {
    repeated RelateCard relates = 1;
}

message ViewReply {
    Tab tab = 5;
    CM cm = 7;
}
