syntax = "proto3";

package bilibili.app.viewunite.v1;

// Wire-compatible subset used to remove promotional material while retaining
// progress points, contract cards and undeclared response fields.

message ProgressMaterial {
    string text = 2;
    string url = 3;
}

message ProgressVideoPoint {
    bool point_permanent = 3;
}

message ProgressContractCard {
    bool play_display_switch = 12;
}

message ProgressVideoShot {
    string pv_data = 1;
}

message VideoGuide {
    repeated ProgressMaterial material = 1;
    ProgressVideoPoint video_point = 2;
    ProgressContractCard contract_card = 3;
}

message ViewProgressReply {
    VideoGuide video_guide = 1;
    ProgressVideoShot arc_shot = 3;
}
