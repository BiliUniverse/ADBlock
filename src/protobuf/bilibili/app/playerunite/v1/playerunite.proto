syntax = "proto3";

package bilibili.app.playerunite.v1;

// Wire-compatible subset of the public API protobuf. Only the fields used by
// ADBlock are declared; protobuf-ts preserves every undeclared field.

message OpaqueMessage {}

enum FragmentType {
    UNKNOWN = 0;
    AD_FRAGMENT = 1;
    OGV_FRAGMENT = 2;
}

message FragmentInfo {
    FragmentType fragment_type = 3;
}

message FragmentVideoInfo {
    FragmentInfo fragment_info = 1;
}

message FragmentVideo {
    repeated FragmentVideoInfo videos = 1;
}

message ViewInfo {
    OpaqueMessage prompt_bar = 2;
}

message PlayViewUniteReply {
    ViewInfo view_info = 9;
    FragmentVideo fragment_video = 10;
}
