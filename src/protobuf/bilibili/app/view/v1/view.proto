syntax = "proto3";

package bilibili.app.view.v1;

// Wire-compatible subset of API/protobuf/bilibili/app/view/v1/view.proto.
// Only fields used by ADBlock are declared; protobuf-ts preserves the rest as
// unknown fields when decoding and encoding the response.

message CM {}

message CMConfig {}

message CmIpad {}

message OpaqueMessage {}

message TIcon {
    string icon = 1;
}

message Tab {
    int32 otype = 2;
    OpaqueMessage ad_tab_info = 11;
}

message Relate {
    string title = 3;
    string goto = 7;
    CM cm = 28;
    string unique_id = 32;
}

message RelatesFeedReply {
    repeated Relate list = 1;
}

message PlayerRelatesReply {
    repeated Relate list = 1;
}

message ViewProgressReply {
    OpaqueMessage video_guide = 1;
}

message TFToast {}

message TFPanelCustomized {}

message TFInfoReply {
    int64 tips_id = 1;
    TFToast tf_toast = 2;
    TFPanelCustomized tf_panel_customized = 3;
}

message ViewReply {
    map<string, TIcon> t_icon = 6;
    repeated Relate relates = 10;
    repeated CM cms = 30;
    CMConfig cm_config = 31;
    Tab tab = 32;
    CmIpad cm_ipad = 41;
    OpaqueMessage cm_under_player = 48;
}
