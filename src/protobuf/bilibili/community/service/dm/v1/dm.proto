syntax = "proto3";

package bilibili.community.service.dm.v1;

// Wire-compatible subset used by the danmaku filters and Airborne feature.
enum DmColorfulType {
    NoneType = 0;
    VipGradualColor = 60001;
}

message CommandDm {}

message CommandDms {
    repeated CommandDm data = 1;
}

message DmViewReply {
    repeated string activity_meta = 18;
    repeated CommandDms commandDms = 22;
}

message DanmakuElem {
    int64 id = 1;
    int32 progress = 2;
    int32 mode = 3;
    int32 fontsize = 4;
    uint32 color = 5;
    string midHash = 6;
    string content = 7;
    int64 ctime = 8;
    int32 weight = 9;
    string action = 10;
    int32 pool = 11;
    string idStr = 12;
    int32 attr = 13;
    string animation = 22;
    DmColorfulType colorful = 24;
    int32 type = 25;
    int64 oid = 26;
    int32 dm_from = 27;
}

message DmColorful {
    DmColorfulType type = 1;
    string src = 2;
}

message DmSegMobileReply {
    repeated DanmakuElem elems = 1;
    int32 state = 2;
    repeated DmColorful colorful_src = 5;
}

message DmSegMobileReq {
    int64 pid = 1;
    int64 oid = 2;
    int32 type = 3;
    int64 segment_index = 4;
}
