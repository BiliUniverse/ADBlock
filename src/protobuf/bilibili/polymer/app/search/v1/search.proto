syntax = "proto3";

package bilibili.polymer.app.search.v1;

// Wire-compatible subset used to identify search ads while preserving every
// undeclared card and field as protobuf unknown data.
message SearchGameCard {}

message SearchAdCard {}

message Item {
    string uri = 1;
    string trackid = 6;
    oneof card_item {
        SearchGameCard game = 11;
        SearchAdCard cm = 25;
    }
}

message SearchAllResponse {
    string trackid = 2;
    repeated Item item = 4;
}
