name: '📺 BiliBili: 🛡️ ADBlock (Rewrite)'
description: 哔哩哔哩：去广告\n自定义去除APP内界面元素
open_url: http://boxjs.com/#/app/BiliBili.ADBlock
author: ClydeTime[https://github.com/ClydeTime],VirgilClyne[https://github.com/VirgilClyne],app2smile[https://github.com/app2smile],RuCu6[https://github.com/RuCu6],Maasea[https://github.com/Maasea]
homepage: https://biliverse.github.io/guide/ad-block
icon: https://github.com/Biliverse/ADBlock/raw/main/src/assets/icon_rounded.png
url_rewrites:
- match: ^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$
  location: http://reject/
  status_code: 307
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(x\/v2\/(?:splash\/(?:brand\/list|event\/list2|list|show)|feed\/index(?:\/story)?|search\/square)(?:\?.*)?)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/api\.bili(bili\.com|api\.net)\/(x\/web-interface\/wbi\/index\/top\/feed\/rcmd(?:\?.*)?)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/api\.bili(bili\.com|api\.net)\/(pgc\/page\/(?:bangumi|cinema\/tab)(?:\?.*)?)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/api\.live\.bilibili\.com\/(xlive\/app-room\/v1\/index\/getInfoByRoom(?:\?.*)?)$
  location: https://app.nanocat.cloud/$1
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.app\.(?:view|viewunite)\.v1\.View\/(?:View|TFInfo|RelatesFeed))$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.app\.dynamic\.v2\.Dynamic\/Dyn(?:All|Video))$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.app\.playurl\.v1\.PlayURL\/PlayView)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.polymer\.app\.search\.v1\.Search\/SearchAll)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.community\.service\.dm\.v1\.DM\/(?:DmView|DmSegMobile))$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.app\.interface\.v1\.Teenagers\/ModeStatus)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.main\.community\.reply\.v1\.Reply\/MainList)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/(bilibili\.pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
  location: https://app.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.app\.(?:view|viewunite)\.v1\.View\/(?:View|TFInfo|RelatesFeed))$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.app\.dynamic\.v2\.Dynamic\/Dyn(?:All|Video))$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.app\.playurl\.v1\.PlayURL\/PlayView)$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.polymer\.app\.search\.v1\.Search\/SearchAll)$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.community\.service\.dm\.v1\.DM\/(?:DmView|DmSegMobile))$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.app\.interface\.v1\.Teenagers\/ModeStatus)$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.main\.community\.reply\.v1\.Reply\/MainList)$
  location: https://grpc.nanocat.cloud/$2
- match: ^https?:\/\/grpc\.bili(bili\.com|api\.net)\/(bilibili\.pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
  location: https://grpc.nanocat.cloud/$2
body_rewrites:
- response_jq:
    match: ^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\?
    filter: del(.data.payment)
map_locals:
- match: ^https?:\/\/api\.vc\.bilibili\.com\/search_svr\/v\d\/Search\/recommend_words
  headers:
    application/json: ''
  body: '{}'
- match: ^https?:\/\/api\.vc\.bilibili\.com\/topic_svr\/v1\/topic_svr
  headers:
    application/json: ''
  body: '{}'
- match: ^https?:\/\/api\.vc\.bilibili\.com\/dynamic_svr\/v1\/dynamic_svr\/mix_uplist
  headers:
    application/json: ''
  body: '{}'
- match: ^https?:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/Flash
  headers:
    application/json: ''
  body: '{}'
- match: ^https?:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/ListFlash
  headers:
    application/json: ''
  body: '{}'
- match: ^https?:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?
  headers:
    application/json: ''
  body: '{}'
- match: ^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?
  headers:
    content-type: ' application/json'
  body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
mitm:
  hostnames:
    includes:
    - manga.bilibili.com
    - api.live.bilibili.com
    - api.vc.bilibili.com
    - app.bilibili.com
    - app.biliapi.net
    - api.bilibili.com
    - api.biliapi.net
    - grpc.biliapi.net
    - grpc.bilibili.com
